name = "picchess-share"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "picchess-share"

# Create with: npx wrangler kv namespace create picchess-share-kv  (then paste the id here)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
