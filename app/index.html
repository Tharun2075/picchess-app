<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262421">
<title>PicChess</title>
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>PicChess</h1>
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="board-wrap">
    <div id="board"></div>
    <svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <div id="promo" hidden role="dialog" aria-label="Choose promotion piece"></div>
  </div>
  <div class="row" id="play-row">
    <button id="edit" type="button">Edit position</button>
    <button id="undo" type="button">Undo</button>
    <button id="flip" type="button">Flip board</button>
    <button id="start" type="button">Start position</button>
  </div>
  <section id="editor" aria-label="Board editor" hidden>
    <div id="palette" role="toolbar" aria-label="Piece palette"></div>
    <div class="row">
      <button id="ed-clear" type="button">Clear</button>
      <button id="ed-start" type="button">Start position</button>
    </div>
    <fieldset><legend>Side to move</legend>
      <label><input type="radio" name="turn" value="w" checked> White</label>
      <label><input type="radio" name="turn" value="b"> Black</label>
    </fieldset>
    <fieldset><legend>I play</legend>
      <label><input type="radio" name="iplay" value="w" checked> White</label>
      <label><input type="radio" name="iplay" value="b"> Black</label>
    </fieldset>
    <fieldset><legend>Castling</legend>
      <label><input type="checkbox" class="castle" value="K"> White O-O</label>
      <label><input type="checkbox" class="castle" value="Q"> White O-O-O</label>
      <label><input type="checkbox" class="castle" value="k"> Black O-O</label>
      <label><input type="checkbox" class="castle" value="q"> Black O-O-O</label>
    </fieldset>
    <label class="ep">En passant square <select id="ep"></select></label>
    <label for="ed-fen">FEN</label>
    <div class="fenrow"><input id="ed-fen" readonly spellcheck="false"><button id="ed-copy" type="button">Copy</button></div>
    <ul id="ed-errors" role="alert"></ul>
    <div class="row">
      <button id="ed-cancel" type="button" class="secondary">Cancel</button>
      <button id="ed-play" type="button">Play this position</button>
    </div>
  </section>
  <section id="hints" aria-label="Engine hints">
    <label class="toggle"><input type="checkbox" id="hints-toggle"> Engine hints</label>
    <div id="hints-status" role="status" aria-live="polite"></div>
    <p class="note">Top 3 moves from Stockfish. Eval is from White's point of view.</p>
    <ol id="hints-list"></ol>
  </section>
  <form id="fen-form" class="fen">
    <label for="fen">Paste a FEN</label>
    <textarea id="fen" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3"></textarea>
    <div id="fen-error" role="alert"></div>
    <button type="submit">Load position</button>
  </form>
  <ol id="moves" aria-label="Moves"></ol>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
